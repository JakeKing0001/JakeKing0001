<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Jake AI project futuristic system panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#081827"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="micro" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0ea5e9" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#micro)"/>
  <rect x="34" y="34" width="1532" height="452" rx="22" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="34" y="34" width="1532" height="6" rx="3" fill="url(#line)" filter="url(#glow)"/>

  <text x="82" y="102" fill="#5eead4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18">CORE PROJECT // JAKE</text>
  <text x="82" y="174" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">PERSONAL AI ASSISTANT</text>
  <text x="82" y="218" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Local-first voice assistant for Windows with HUD, tools, memory and multi-step reasoning.</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17">
    <rect x="82" y="274" width="218" height="46" rx="9" fill="#05211f" stroke="#14b8a6" stroke-opacity=".7"/><text x="105" y="303" fill="#5eead4">VOICE // WHISPER</text>
    <rect x="314" y="274" width="190" height="46" rx="9" fill="#071827" stroke="#38bdf8" stroke-opacity=".7"/><text x="337" y="303" fill="#7dd3fc">OLLAMA // LOCAL</text>
    <rect x="518" y="274" width="174" height="46" rx="9" fill="#100d1d" stroke="#8b5cf6" stroke-opacity=".7"/><text x="541" y="303" fill="#c4b5fd">PYTHON 3.11+</text>
    <rect x="706" y="274" width="208" height="46" rx="9" fill="#071827" stroke="#38bdf8" stroke-opacity=".7"/><text x="729" y="303" fill="#7dd3fc">HUD // PYSIDE6</text>
  </g>

  <g transform="translate(1050 90)">
    <circle cx="210" cy="168" r="132" fill="#061520" stroke="#0ea5e9" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="210" cy="168" r="96" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 12"/>
    <circle cx="210" cy="168" r="61" fill="none" stroke="#a78bfa" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="210" cy="168" r="20" fill="#2dd4bf" opacity=".85" filter="url(#glow)"/>
    <path d="M210 36v58M210 242v58M78 168h58M284 168h58" stroke="#38bdf8" stroke-opacity=".35" stroke-width="2"/>
    <text x="148" y="348" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">AGENT CORE ONLINE</text>
  </g>

  <text x="82" y="390" fill="#cbd5e1" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18">STATUS  ● ACTIVE    MODE  ● LOCAL-FIRST    FOCUS  ● AUTOMATION / AGENTS / HUMAN-COMPUTER INTERACTION</text>
  <text x="82" y="446" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">WAKE WORD → UNDERSTAND → PLAN → ACT → VERIFY → RESPOND</text>
</svg>