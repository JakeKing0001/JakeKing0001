<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Jake AI architecture command panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/><stop offset="0.55" stop-color="#04131F"/><stop offset="1" stop-color="#0B0715"/>
    </linearGradient>
    <linearGradient id="bar" x1="40" y1="0" x2="1560" y2="0"><stop stop-color="#2DD4BF"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="micro" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#0EA5E9" stroke-opacity=".042"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="640" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="30" fill="url(#micro)"/>
  <rect x="28" y="28" width="1544" height="584" rx="22" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="28" y="28" width="1544" height="5" rx="2.5" fill="url(#bar)" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="72" cy="75" r="5" fill="#22C55E" filter="url(#glow)"/>
    <text x="90" y="82" fill="#5EEAD4" font-size="17">CORE PROJECT // JAKE</text>
    <text x="1312" y="82" fill="#475569" font-size="14">LOCAL NODE / WIN</text>
  </g>

  <text x="72" y="160" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="850">PERSONAL AI SYSTEM</text>
  <text x="72" y="202" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Voice, memory, reasoning, tools and a Jarvis-style interface — running around a local-first core.</text>

  <g transform="translate(72 266)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect x="0" y="0" width="194" height="92" rx="14" fill="#05201F" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="20" y="31" fill="#5EEAD4" font-size="13">01 // INPUT</text>
      <text x="20" y="59" fill="#F0FDFA" font-size="19">VOICE</text>
      <text x="20" y="79" fill="#64748B" font-size="13">Whisper + wake word</text>
    </g>
    <g>
      <rect x="236" y="0" width="194" height="92" rx="14" fill="#071827" stroke="#38BDF8" stroke-opacity="0.55"/>
      <text x="256" y="31" fill="#7DD3FC" font-size="13">02 // PARSE</text>
      <text x="256" y="59" fill="#EFF6FF" font-size="19">UNDERSTAND</text>
      <text x="256" y="79" fill="#64748B" font-size="13">NLU + retrieval</text>
    </g>
    <g>
      <rect x="472" y="0" width="194" height="92" rx="14" fill="#071827" stroke="#38BDF8" stroke-opacity="0.55"/>
      <text x="492" y="31" fill="#7DD3FC" font-size="13">03 // THINK</text>
      <text x="492" y="59" fill="#EFF6FF" font-size="19">REASON</text>
      <text x="492" y="79" fill="#64748B" font-size="13">Ollama + agents</text>
    </g>
    <g>
      <rect x="708" y="0" width="194" height="92" rx="14" fill="#100C1B" stroke="#A78BFA" stroke-opacity="0.58"/>
      <text x="728" y="31" fill="#C4B5FD" font-size="13">04 // EXECUTE</text>
      <text x="728" y="59" fill="#FAF5FF" font-size="19">ACT</text>
      <text x="728" y="79" fill="#64748B" font-size="13">Skills + tools</text>
    </g>
    <g>
      <rect x="944" y="0" width="194" height="92" rx="14" fill="#06131B" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="964" y="31" fill="#5EEAD4" font-size="13">05 // CHECK</text>
      <text x="964" y="59" fill="#F0FDFA" font-size="19">VERIFY</text>
      <text x="964" y="79" fill="#64748B" font-size="13">Real result loop</text>
    </g>

    <g stroke="url(#bar)" stroke-width="2" stroke-opacity="0.55">
      <path d="M194 46H236"/><path d="M430 46H472"/><path d="M666 46H708"/><path d="M902 46H944"/>
    </g>
    <circle cx="0" cy="46" r="4" fill="#2DD4BF"/>
    <circle cx="1138" cy="46" r="4" fill="#2DD4BF"/>
    <circle r="4" fill="#ECFEFF" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M194 46 H944"/>
    </circle>
  </g>

  <g transform="translate(1218 250)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="306" height="238" rx="18" fill="#050B14" stroke="#1E293B"/>
    <text x="22" y="34" fill="#64748B" font-size="13">RUNTIME MATRIX</text>
    <text x="22" y="70" fill="#A5F3FC" font-size="16">LOCAL AI</text><text x="240" y="70" fill="#22C55E" font-size="15">READY</text>
    <path d="M22 84H284" stroke="#172033"/>
    <text x="22" y="112" fill="#A5F3FC" font-size="16">MEMORY</text><text x="238" y="112" fill="#22C55E" font-size="15">ACTIVE</text>
    <path d="M22 126H284" stroke="#172033"/>
    <text x="22" y="154" fill="#A5F3FC" font-size="16">TOOLS</text><text x="230" y="154" fill="#38BDF8" font-size="15">LOADED</text>
    <path d="M22 168H284" stroke="#172033"/>
    <text x="22" y="196" fill="#A5F3FC" font-size="16">LEARNING</text><text x="224" y="196" fill="#A78BFA" font-size="15">ENABLED</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="72" y="438" width="262" height="70" rx="12" fill="#06131B" stroke="#2DD4BF" stroke-opacity="0.28"/>
    <text x="92" y="464" fill="#64748B">INTERFACE</text><text x="92" y="490" fill="#E2E8F0" font-size="17">PySide6 HUD</text>
    <rect x="350" y="438" width="262" height="70" rx="12" fill="#071827" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text x="370" y="464" fill="#64748B">MODEL LAYER</text><text x="370" y="490" fill="#E2E8F0" font-size="17">Ollama / Qwen</text>
    <rect x="628" y="438" width="262" height="70" rx="12" fill="#071827" stroke="#38BDF8" stroke-opacity="0.28"/>
    <text x="648" y="464" fill="#64748B">AUTOMATION</text><text x="648" y="490" fill="#E2E8F0" font-size="17">Skills + Agents</text>
    <rect x="906" y="438" width="262" height="70" rx="12" fill="#100C1B" stroke="#A78BFA" stroke-opacity="0.28"/>
    <text x="926" y="464" fill="#64748B">DEPLOYMENT</text><text x="926" y="490" fill="#E2E8F0" font-size="17">Windows + Linux node</text>
  </g>

  <text x="72" y="568" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">WAKE → UNDERSTAND → REASON → ACT → VERIFY → RESPOND</text>
  <text x="1218" y="568" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">CORE STATUS :: ACTIVE</text>
</svg>
