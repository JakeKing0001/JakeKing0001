<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="JakeKing0001 futuristic developer profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.48" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b0614"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.52" stop-color="#42a5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00f5d4" stop-opacity=".65"/>
      <stop offset=".42" stop-color="#1d4ed8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="34" fill="url(#grid)"/>
  <circle cx="1280" cy="304" r="300" fill="url(#orb)"/>
  <circle cx="1280" cy="304" r="154" fill="none" stroke="#00f5d4" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="1280" cy="304" r="114" fill="none" stroke="#60a5fa" stroke-opacity=".25" stroke-width="2" stroke-dasharray="9 13"/>
  <circle cx="1280" cy="304" r="74" fill="none" stroke="#a855f7" stroke-opacity=".38" stroke-width="2"/>
  <circle cx="1280" cy="304" r="20" fill="#00f5d4" opacity=".8" filter="url(#glow)"/>

  <g opacity=".5" stroke="url(#neon)" fill="none" stroke-width="2">
    <path d="M1010 116h154l28 28h116"/>
    <path d="M980 492h124l40-40h174"/>
    <path d="M1088 190h76l36 36h162"/>
    <path d="M1034 386h100l34-34h206"/>
  </g>
  <g fill="#00f5d4" opacity=".9">
    <circle cx="1010" cy="116" r="5"/><circle cx="1308" cy="144" r="5"/>
    <circle cx="980" cy="492" r="5"/><circle cx="1318" cy="452" r="5"/>
  </g>

  <rect x="72" y="70" width="720" height="36" rx="18" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="98" cy="88" r="6" fill="#22c55e"/>
  <text x="118" y="95" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SYSTEM://PROFILE ONLINE</text>

  <text x="72" y="220" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="3">JAKEKING0001</text>
  <rect x="72" y="246" width="650" height="5" rx="2.5" fill="url(#neon)" filter="url(#glow)"/>
  <text x="72" y="320" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" letter-spacing="2">COMPUTER ENGINEERING // AI // SOFTWARE SYSTEMS</text>
  <text x="72" y="372" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Building local AI assistants, full-stack products and intelligent interfaces.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <rect x="72" y="438" width="196" height="48" rx="10" fill="#06131b" stroke="#00f5d4" stroke-opacity=".6"/>
    <text x="96" y="469" fill="#5eead4">● JAKE ACTIVE</text>
    <rect x="282" y="438" width="230" height="48" rx="10" fill="#07111f" stroke="#42a5ff" stroke-opacity=".6"/>
    <text x="306" y="469" fill="#93c5fd">◇ FULL-STACK DEV</text>
    <rect x="526" y="438" width="218" height="48" rx="10" fill="#0f0a18" stroke="#a855f7" stroke-opacity=".6"/>
    <text x="550" y="469" fill="#d8b4fe">⌁ LOCAL AI LAB</text>
  </g>

  <text x="72" y="554" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">BUILD • TEST • ITERATE • DEPLOY</text>
  <text x="1452" y="558" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">v2.0</text>
</svg>