    </circle>
    <circle cx="272" cy="252" r="108" fill="none" stroke="#A78BFA" stroke-opacity="0.48" stroke-width="2" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 272 252" to="0 272 252" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="252" r="74" fill="url(#core)" opacity="0.94">
      <animate attributeName="opacity" values="0.72;1;0.72" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="252" r="18" fill="#ECFEFF" filter="url(#glow)"/>

    <g stroke="#38BDF8" stroke-opacity="0.28" fill="none">
      <path d="M272 70v78"/><path d="M272 356v78"/><path d="M90 252h78"/><path d="M376 252h78"/>
      <path d="M143 123l54 54"/><path d="M347 327l54 54"/><path d="M143 381l54-54"/><path d="M347 177l54-54"/>
