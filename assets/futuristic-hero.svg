<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="JakeKing0001 advanced futuristic developer HUD">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.48" stop-color="#04101d"/>
      <stop offset="1" stop-color="#0b0615"/>
    </linearGradient>
    <linearGradient id="neon" x1="130" y1="0" x2="1360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="0.48" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="0.08" stop-color="#67E8F9"/>
      <stop offset="0.26" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="0.58" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#14B8A6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#38BDF8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1H1600" stroke="#E2E8F0" stroke-opacity="0.016"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="34" fill="url(#grid)"/>
  <rect width="1600" height="760" rx="34" fill="url(#scan)"/>
  <rect x="22" y="22" width="1556" height="716" rx="26" fill="none" stroke="#1E293B" stroke-width="2"/>
  <path d="M48 116H1552" stroke="url(#neon)" stroke-opacity="0.28"/>
  <path d="M48 644H1552" stroke="url(#neon)" stroke-opacity="0.18"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="72" cy="70" r="6" fill="#22C55E" filter="url(#glow)"/>
    <text x="90" y="77" fill="#A5F3FC" font-size="16">PROFILE NODE // ACTIVE</text>
    <text x="1275" y="77" fill="#475569" font-size="15">JAKEKING0001 :: V3/HUD</text>
  </g>

  <g>
