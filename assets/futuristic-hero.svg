      <text x="220" y="34" fill="#5EEAD4">VOICE / STT</text>
      <rect x="391" y="87" width="140" height="34" rx="8" fill="#071827" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="416" y="109" fill="#7DD3FC">MEMORY</text>
      <rect x="399" y="386" width="132" height="34" rx="8" fill="#100C1B" stroke="#A78BFA" stroke-opacity="0.38"/>
      <text x="422" y="408" fill="#C4B5FD">AGENTS</text>
      <rect x="4" y="386" width="140" height="34" rx="8" fill="#071827" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="33" y="408" fill="#7DD3FC">TOOLS</text>
      <rect x="12" y="87" width="140" height="34" rx="8" fill="#06131B" stroke="#2DD4BF" stroke-opacity="0.35"/>
      <text x="34" y="109" fill="#5EEAD4">REASONING</text>
    </g>

    <text x="206" y="247" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">JAKE CORE</text>
    <text x="201" y="274" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">AGENT MATRIX ACTIVE</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="78" y="692" fill="#475569" font-size="15">BUILD // VERIFY // ITERATE // SHIP</text>
    <text x="620" y="692" fill="#334155" font-size="14">SIGNAL: STABLE</text>
    <text x="782" y="692" fill="#334155" font-size="14">ENV: WINDOWS + LINUX</text>
    <text x="1038" y="692" fill="#334155" font-size="14">FOCUS: AGENTS / FULL-STACK / HCI</text>
