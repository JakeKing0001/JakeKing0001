    <text x="78" y="378" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" letter-spacing="1.8">COMPUTER ENGINEERING // AI SYSTEMS</text>
    <text x="78" y="426" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">I build intelligent tools, interfaces and local-first systems.</text>
    <text x="78" y="460" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Current core: Jake — personal AI assistant for Windows.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
