    <text x="98" y="534" fill="#5EEAD4" font-size="12">PRIMARY CORE</text>
    <text x="98" y="554" fill="#F0FDFA" font-size="17">JAKE // ONLINE</text>

    <rect x="308" y="512" width="214" height="54" rx="10" fill="#071827" stroke="#38BDF8" stroke-opacity="0.58"/>
    <text x="328" y="534" fill="#7DD3FC" font-size="12">SYSTEM MODE</text>
    <text x="328" y="554" fill="#EFF6FF" font-size="17">LOCAL-FIRST</text>

